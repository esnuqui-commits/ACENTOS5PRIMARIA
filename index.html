function r5(){B5={w:sh(['aguda','llana','esdrújula'].flatMap(k=>[0,1,2].map(()=>pk(y=>!y.h&&y.k==k)))),z:{},sel:null,done:0};d5()}
function d5(){const b=B5,chip=(x,i)=>`<span class="chip ${b.sel==i?'sel':''} ${b.done?(b.z[i]==x.k?'ok':'bad'):''}" draggable="${!b.done}" ondragstart="event.dataTransfer.setData('t','${i}')" onclick="event.stopPropagation();c5(${i})">${x.w}</span>`,all=b.w.every((x,i)=>b.z[i]);
show(`<h2>${NM[5]}</h2><p>Arrastra cada palabra a su columna, o toca la palabra y luego la columna.</p><div class="c" ondragover="event.preventDefault()" ondrop="d5drop(event,null)" style="min-height:80px">${b.w.map((x,i)=>b.z[i]?'':chip(x,i)).join('')||'¡Todas colocadas!'}</div><div class="grid">${['aguda','llana','esdrújula'].map(k=>`<div class="z" style="--c:${CL[k]}" ondragover="event.preventDefault()" ondrop="d5drop(event,'${k}')" onclick="z5('${k}')"><b style="color:${CL[k]}">${PL[k]}</b><br>${b.w.map((x,i)=>b.z[i]==k?chip(x,i):'').join('')}</div>`).join('')}</div>`+(b.done?`<div class="fb ${GM.ok>6?'g':'b'}"><b>${GM.ok} de 9 correctas</b>${b.w.map((x,i)=>b.z[i]==x.k?'':`<p>${ex(x)}</p>`).join('')}<button onclick="end()">Ver resultado</button></div>`:all?'<button onclick="ck5()">Comprobar</button>':''))}
function c5(i){if(B5.done)return;if(B5.z[i])B5.z[i]=null;else B5.sel=B5.sel==i?null:i;d5()}
function z5(k){if(B5.done||B5.sel==null)return;B5.z[B5.sel]=k;B5.sel=null;d5()}
function d5drop(e,k){e.preventDefault();if(B5.done)return;B5.z[+e.dataTransfer.getData('t')]=k;B5.sel=null;d5()}
function ck5(){B5.w.forEach((x,i)=>rec(B5.z[i]==x.k,x));B5.done=1;GM.i=9;badges();save();d5()}
function end(){const g=GM,p=pct(g.ok,g.n);S.h.push({m:g.m,p});S.h=S.h.slice(-12);if(g.m==7&&p>=80)S.rf=1;badges();save();if(p>=70)conf();
show(`<div class="c" style="text-align:center"><h2>${NM[g.m]}</h2><div class="w">${'★'.repeat(p>=90?3:p>=70?2:1)}</div><p><b>${g.ok} de ${g.n} aciertos (${p} %)</b> · +${g.pts} puntos</p><p>${p>=90?'¡Increíble, eres un maestro de la tilde!':p>=70?'¡Muy buen trabajo!':p>=40?'¡Vas por buen camino! Repasa las reglas y vuelve a intentarlo.':'¡Sigue practicando! Cada intento te hace mejor.'}</p><button onclick="start(${g.m})">Jugar otra vez</button> <button onclick="learn()">Repasar reglas</button> <button onclick="home()">Menú</button></div>`)}
function dash(){const er=Object.entries(S.er).sort((a,b)=>b[1]-a[1]),mx=er[0]?er[0][1]:1,EN={aguda:'Palabras agudas',llana:'Palabras llanas',esdrújula:'Palabras esdrújulas',hiato:'Hiatos'};
show(`<h2>📊 Mis resultados</h2><div class="grid"><div class="c"><b>Actividades</b><div class="w">${S.h.length?S.tot:0}</div>preguntas respondidas: ${S.tot}</div><div class="c"><b>Aciertos</b><div class="w">${pct(S.ok,S.tot)} %</div></div><div class="c"><b>Puntos</b><div class="w">${S.p}</div>Mejor racha: ${S.bk}</div></div>
<div class="c"><h3>Por actividad</h3>${[1,2,3,4,5,6,7].map(m=>`<div class="row"><span style="width:230px">${NM[m]}</span><i style="width:${pct(sm(m).ok,sm(m).tot)*.5}%"></i> ${sm(m).tot?pct(sm(m).ok,sm(m).tot)+' %':'—'}</div>`).join('')}</div>
<div class="c"><h3>Errores más frecuentes</h3>${er.length?er.map(([k,v])=>`<div class="row"><span style="width:180px">${EN[k]}</span><i style="width:${v/mx*50}%"></i> ${v}</div>`).join(''):'¡Aún no hay errores!'}</div>
<div class="c"><h3>Evolución (últimas partidas)</h3>${S.h.length?`<div class="ev">${S.h.map(h=>`<i style="height:${Math.max(h.p,3)}%" title="${h.p} %"></i>`).join('')}</div>`:'Juega una partida para ver tu evolución.'}</div>
<div class="c"><h3>Medallas (${S.bd.length}/${BG.length})</h3>${BG.map((b,i)=>`<div class="bd ${S.bd.includes(i)?'':'l'}"><span>${b[0]}</span>${b[1]}</div>`).join('')}</div>
<button onclick="if(confirm('¿Seguro que quieres borrar todo el progreso?')){S=def();save();dash()}" style="background:#b3261e">Reiniciar progreso</button>`)}
home();
</script></body></html>
